# A release is cut by hand (release.yml) from main. The commit types decide its
# number; the commit carrying the new plugin.json version is the one tagged, so
# the plugin names exactly the release its launcher fetches.
#
# The release notes never pass through a shell: @semantic-release/github
# creates the release carrying them, and GoReleaser uploads the archives into
# it, keeping its notes. Interpolating them into a command would let a commit
# subject run as shell under a token that writes to the repository.
branches:
  - main
tagFormat: v${version}
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
  - - "@semantic-release/exec"
    - prepareCmd: >-
        sed -i 's/"version": "[^"]*"/"version": "${nextRelease.version}"/' .claude-plugin/plugin.json
  - - "@semantic-release/git"
    - assets:
        - .claude-plugin/plugin.json
      message: "chore(release): v${nextRelease.version} [skip ci]"
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      releasedLabels: false
  - - "@semantic-release/exec"
    - publishCmd: goreleaser release --clean
