name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: source/hooks/go.mod
          cache-dependency-path: source/hooks/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          install-only: true

      # The notes generator semantic-release bundles renders with
      # conventional-changelog-writer 8; the conventionalcommits preset needs
      # writer 9 from its major 10 on, so it stays on major 9.
      - run: >-
          npx --yes
          -p semantic-release@25.0.9
          -p @semantic-release/exec@7.1.0
          -p @semantic-release/git@11.0.1
          -p @semantic-release/github@12.0.10
          -p conventional-changelog-conventionalcommits@9.3.1
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
