version: 2

project_name: agentic-helpers

builds:
  - &binary
    id: agentic-capture
    dir: source/hooks
    main: ./cmd/agentic-capture
    binary: agentic-capture
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - <<: *binary
    id: agentic-memory
    main: ./cmd/agentic-memory
    binary: agentic-memory
  - <<: *binary
    id: agentic-grounding-gate
    main: ./cmd/agentic-grounding-gate
    binary: agentic-grounding-gate
  - <<: *binary
    id: agentic-scratch
    main: ./cmd/agentic-scratch
    binary: agentic-scratch
  - <<: *binary
    id: agentic-tools
    main: ./cmd/agentic-tools
    binary: agentic-tools
  - <<: *binary
    id: agentic-shell-guard
    main: ./cmd/agentic-shell-guard
    binary: agentic-shell-guard
  - <<: *binary
    id: agentic-helpers
    main: ./cmd/agentic-helpers
    binary: agentic-helpers

# hooks/run fetches agentic-helpers_<version>_<os>_<arch>.tar.gz and checks it
# against checksums.txt; both names are part of its contract.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# @semantic-release/github creates the release with its notes; GoReleaser adds
# the archives and checksums.txt to it and leaves the notes as they are.
release:
  mode: keep-existing
