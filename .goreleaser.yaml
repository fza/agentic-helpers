version: 2

project_name: agentic-helpers

builds:
  - &binary
    id: agentic-helpers
    dir: source/hooks
    main: ./cmd/agentic-helpers
    binary: agentic-helpers
    # Drops the build machine's paths from every program, which also keeps
    # the unpacked release within its size budget.
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
  - <<: *binary
    id: agentic-shell-guard
    main: ./cmd/agentic-shell-guard
    binary: agentic-shell-guard

# hooks/run fetches agentic-helpers_<version>_<os>_<arch>.tar.gz and checks it
# against checksums.txt; both names are part of its contract. agentic-memory,
# agentic-tools and agentic-scratch are links to
# agentic-helpers, which runs the command its name picks; the archive keeps
# them as links, so no name costs a copy of the program.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - src: source/hooks/cmd/agentic-helpers/links/agentic-*
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# @semantic-release/github creates the release as a draft with its notes;
# GoReleaser finds that draft by name (both name it v<version>), adds the
# archives and checksums.txt, leaves the notes as they are, and publishes it,
# since `draft` stays false. Releases are immutable, so nothing could be added
# after publishing. A draft is not found by its tag, hence use_existing_draft.
release:
  mode: keep-existing
  use_existing_draft: true
